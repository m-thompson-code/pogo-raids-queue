@let authState = user$ | async;

@if (showAnimatedBackground) {
  <div class="app-background" aria-hidden="true">
    @for (tile of backgroundTiles; track tile.src; let index = $index) {
      <div
        class="app-background__layer"
        [style.background-image]="'url(' + tile.src + ')'"
        [style.--psyduck-drift-delay]="tile.driftDelay"
        [style.--psyduck-visibility-duration]="backgroundVisibilityDuration"
        [style.--psyduck-visibility-delay]="tile.visibilityDelay"
      ></div>
    }
  </div>
}

@if (authState === undefined) {
  <!-- resolving auth state -->
} @else if (authState) {
  <nav class="app-nav">
    <a routerLink="/" routerLinkActive="app-nav__link--active" [routerLinkActiveOptions]="{exact: true}" class="app-nav__link">Queue</a>
    <a routerLink="/users" routerLinkActive="app-nav__link--active" class="app-nav__link">Users</a>
  </nav>
  <router-outlet />
  <app-settings />
  <button class="regirice-btn" (click)="spawnRegirice()" aria-label="Spawn Regirice">
    <img src="/regirice.png" alt="" aria-hidden="true" />
  </button>
  @for (sprite of regirice(); track sprite.id) {
    <img class="regirice-sprite" src="regirice.png" alt="Regirice" [style]="sprite.style" />
  }
} @else {
  <app-login />
}
